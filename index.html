<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Wedding Anniversary</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  width:100vw;
  height:100vh;
  overflow:hidden;

  background:#f5f5f5;

  display:flex;
  justify-content:center;
  align-items:center;

  font-family:Arial, sans-serif;
}

.container{
  width:100%;
  height:100%;

  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:40px;
}

/* 액자 */

.frame{
  width:70vw;
  max-width:1100px;

  aspect-ratio:16/9;

  position:relative;

  background:white;

  border:2px solid rgba(0,0,0,0.08);

  overflow:hidden;

  box-shadow:
    0 10px 40px rgba(0,0,0,0.08);
}

/* 슬롯 */

.slot{
  position:absolute;

  border:1px solid rgba(0,0,0,0.05);
}

/* 퍼즐 창 */

.pieces-panel{
  width:320px;
  height:90vh;

  background:white;

  border-radius:30px;

  padding:20px;

  border:1px solid rgba(0,0,0,0.08);

  display:flex;
  flex-wrap:wrap;
  align-content:flex-start;

  gap:10px;

  overflow-y:auto;

  box-shadow:
    0 10px 30px rgba(0,0,0,0.05);
}

/* 퍼즐 조각 */

.piece{
  width:60px;
  height:60px;

  border:1px solid rgba(0,0,0,0.08);

  cursor:grab;

  background-image:url("family.png");

  background-size:600% 400%;

  transition:0.2s;

  box-shadow:
    0 5px 10px rgba(0,0,0,0.08);
}

.piece:hover{
  transform:scale(1.05);
}

.piece.dragging{
  opacity:0.5;
}

/* 완성 사진 */

.full-photo{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  opacity:0;

  transition:2s ease;
}

.frame.revealed .full-photo{
  opacity:1;
}

/* 빛 효과 */

.flash{
  position:absolute;
  inset:0;

  background:white;

  opacity:0;

  pointer-events:none;
}

.frame.active .flash{
  animation:flashAnim 1.5s ease;
}

@keyframes flashAnim{

  0%{
    opacity:0;
  }

  40%{
    opacity:1;
  }

  100%{
    opacity:0;
  }

}

</style>
</head>

<body>

<div class="container">

  <!-- 액자 -->

  <div class="frame" id="frame">

    <img
      src="family.png"
      class="full-photo"
    >

    <div class="flash"></div>

  </div>

  <!-- 퍼즐창 -->

  <div class="pieces-panel" id="piecesPanel"></div>

</div>

<script>

const frame = document.getElementById("frame");
const piecesPanel = document.getElementById("piecesPanel");

const cols = 6;
const rows = 4;

const total = cols * rows;

let correct = 0;

/* 슬롯 생성 */

for(let y=0; y<rows; y++){

  for(let x=0; x<cols; x++){

    const slot = document.createElement("div");

    slot.classList.add("slot");

    const w = 100 / cols;
    const h = 100 / rows;

    slot.style.width = w + "%";
    slot.style.height = h + "%";

    slot.style.left = x * w + "%";
    slot.style.top = y * h + "%";

    const index = y * cols + x;

    slot.dataset.index = index;

    slot.addEventListener("dragover", e=>{
      e.preventDefault();
    });

    slot.addEventListener("drop", e=>{

      e.preventDefault();

      const pieceId = e.dataTransfer.getData("text");

      const piece = document.getElementById(pieceId);

      if(piece.dataset.index === slot.dataset.index){

        if(!slot.hasChildNodes()){

          slot.appendChild(piece);

          piece.style.width = "100%";
          piece.style.height = "100%";

          piece.style.cursor = "default";

          piece.draggable = false;

          piece.style.transform = "scale(1)";

          correct++;

          if(correct === total){

            reveal();

          }

        }

      }

    });

    frame.appendChild(slot);

  }

}

/* 퍼즐 생성 */

for(let y=0; y<rows; y++){

  for(let x=0; x<cols; x++){

    const piece = document.createElement("div");

    piece.classList.add("piece");

    const index = y * cols + x;

    piece.id = "piece-" + index;

    piece.dataset.index = index;

    piece.draggable = true;

    /* 이미지 위치 */

    piece.style.backgroundPosition =
      `${(x/(cols-1))*100}% ${(y/(rows-1))*100}%`;

    piece.addEventListener("dragstart", e=>{

      piece.classList.add("dragging");

      e.dataTransfer.setData("text", piece.id);

    });

    piece.addEventListener("dragend", ()=>{

      piece.classList.remove("dragging");

    });

    piecesPanel.appendChild(piece);

  }

}

/* reveal */

function reveal(){

  frame.classList.add("active");

  setTimeout(()=>{

    frame.classList.add("revealed");

  },700);

}

</script>

</body>
</html>
