<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Wedding Anniversary</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  width:100vw;
  height:100vh;
  overflow:hidden;

  background:#f5f5f5;

  display:flex;
  justify-content:center;
  align-items:center;

  font-family:Arial, sans-serif;
}

/* 전체 */

.container{
  width:100%;
  height:100%;

  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:40px;
  gap:40px;
}

/* 액자 */

.frame{
  width:70vw;
  max-width:1100px;

  aspect-ratio:16/9;

  position:relative;

  background:white;

  border:2px solid rgba(0,0,0,0.08);

  overflow:hidden;

  box-shadow:
    0 10px 40px rgba(0,0,0,0.08);
}

/* 퍼즐 슬롯 */

.slot{
  position:absolute;

  border:1px solid rgba(0,0,0,0.05);
}

/* 퍼즐 패널 */

.pieces-panel{
  width:320px;
  height:90vh;

  background:white;

  border-radius:30px;

  padding:20px;

  border:1px solid rgba(0,0,0,0.08);

  display:flex;
  flex-wrap:wrap;
  align-content:flex-start;

  gap:10px;

  overflow-y:auto;

  box-shadow:
    0 10px 30px rgba(0,0,0,0.05);
}

/* 퍼즐 조각 */

.piece{
  width:60px;
  height:60px;

  border:1px solid rgba(0,0,0,0.08);

  cursor:grab;

  background-image:url("family.png");

  background-size:600% 400%;

  background-repeat:no-repeat;

  transition:0.2s;

  box-shadow:
    0 5px 10px rgba(0,0,0,0.08);
}

.piece:hover{
  transform:scale(1.05);
}

.piece.dragging{
  opacity:0.5;
}

/* 완성 사진 */

.full-photo{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  opacity:0;

  transition:2s ease;

  z-index:2;
}

.frame.revealed .full-photo{
  opacity:1;
}

/* 빛 효과 */

.flash{
  position:absolute;
  inset:0;

  background:
    radial-gradient(
      circle,
      rgba(255,255,255,0.95) 0%,
      rgba(255,255,255,0.7) 30%,
      rgba(255,255,255,0.2) 60%,
      transparent 100%
    );

  opacity:0;

  transform:scale(0.8);

  pointer-events:none;

  z-index:5;
}

.frame.active .flash{
  animation:flashAnim 1.5s ease;
  filter:blur(20px);
}

@keyframes flashAnim{

  0%{
    opacity:0;
    transform:scale(0.8);
  }

  30%{
    opacity:1;
    transform:scale(1.1);
  }

  100%{
    opacity:0;
    transform:scale(1.4);
  }

}

/* 문구 */

.message{
  position:absolute;

  bottom:-70px;

  left:50%;

  transform:translateX(-50%);

  font-size:16px;

  letter-spacing:2px;

  color:#666;
}

/* 모바일 */

@media(max-width:900px){

  body{
    overflow:auto;
  }

  .container{
    flex-direction:column;
    padding:20px;
  }

  .frame{
    width:95vw;
  }

  .pieces-panel{
    width:100%;
    height:250px;
  }

}

</style>
</head>

<body>

<div class="container">

  <!-- 액자 -->

  <div class="frame" id="frame">

    <!-- 빛 -->

    <div class="flash"></div>

    <!-- 완성 사진 -->

    <img
      src="family.png"
      class="full-photo"
    >

    <!-- 문구 -->

    <div class="message">
      Put the memories back together
    </div>

  </div>

  <!-- 퍼즐창 -->

  <div class="pieces-panel" id="piecesPanel"></div>

</div>

<script>

const frame = document.getElementById("frame");
const piecesPanel = document.getElementById("piecesPanel");

const cols = 6;
const rows = 4;

const total = cols * rows;

let correct = 0;

/* 슬롯 생성 */

for(let y=0; y<rows; y++){

  for(let x=0; x<cols; x++){

    const slot = document.createElement("div");

    slot.classList.add("slot");

    const w = 100 / cols;
    const h = 100 / rows;

    slot.style.width = w + "%";
    slot.style.height = h + "%";

    slot.style.left = x * w + "%";
    slot.style.top = y * h + "%";

    const index = y * cols + x;

    slot.dataset.index = index;

    /* 드래그 허용 */
    slot.addEventListener("dragover", e=>{
      e.preventDefault();
    });

    /* 드롭 */
    slot.addEventListener("drop", e=>{

      e.preventDefault();

      const pieceId =
        e.dataTransfer.getData("text/plain");

      const piece =
        document.getElementById(pieceId);

      if(piece.dataset.index === slot.dataset.index){

        if(!slot.hasChildNodes()){

          slot.appendChild(piece);

          piece.style.width = "100%";
          piece.style.height = "100%";

          piece.style.cursor = "default";

          piece.draggable = false;

          piece.style.transform = "scale(1)";

          correct++;

          /* 마지막 퍼즐 완성 */

          if(correct === total){

            reveal();

          }

        }

      }

    });

    frame.appendChild(slot);

  }

}

/* 퍼즐 생성 */

for(let y=0; y<rows; y++){

  for(let x=0; x<cols; x++){

    const piece = document.createElement("div");

    piece.classList.add("piece");

    const index = y * cols + x;

    piece.id = "piece-" + index;

    piece.dataset.index = index;

    /* ⭐⭐⭐ 핵심 드래그 기능 */

    piece.setAttribute("draggable","true");

    /* 이미지 위치 */

    piece.style.backgroundPosition =
      `${(x/(cols-1))*100}% ${(y/(rows-1))*100}%`;

    /* 드래그 시작 */

    piece.addEventListener("dragstart", e=>{

      piece.classList.add("dragging");

      e.dataTransfer.effectAllowed = "move";

      e.dataTransfer.setData(
        "text/plain",
        piece.id
      );

    });

    /* 드래그 종료 */

    piece.addEventListener("dragend", ()=>{

      piece.classList.remove("dragging");

    });

    piecesPanel.appendChild(piece);

  }

}

/* reveal */

function reveal(){

  frame.classList.add("active");

  setTimeout(()=>{

    frame.classList.add("revealed");

  },500);

}

</script>

</body>
</html>
