<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Wedding Anniversary Puzzle</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  width:100vw;
  height:100vh;
  overflow:hidden;

  background:#f5f5f5;

  font-family:Arial, sans-serif;
}

.container{
  width:100%;
  height:100%;

  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:40px;
  gap:40px;
}

/* 액자 */

.frame{
  width:70vw;
  max-width:1100px;

  aspect-ratio:16/9;

  position:relative;

  background:white;

  border:2px solid rgba(0,0,0,0.08);

  overflow:hidden;

  box-shadow:
    0 10px 40px rgba(0,0,0,0.08);
}

/* 슬롯 */

.slot{
  position:absolute;

  border:1px solid rgba(0,0,0,0.05);

  overflow:hidden;
}

/* 퍼즐창 */

.pieces-panel{
  width:320px;
  height:90vh;

  background:white;

  border-radius:30px;

  padding:20px;

  border:1px solid rgba(0,0,0,0.08);

  position:relative;

  box-shadow:
    0 10px 30px rgba(0,0,0,0.05);
}

/* 퍼즐 조각 */

.piece{
  width:60px;
  height:60px;

  position:absolute;

  border:1px solid rgba(0,0,0,0.08);

  background-image:url("family.png");

  background-size:600% 400%;

  background-repeat:no-repeat;

  box-shadow:
    0 5px 10px rgba(0,0,0,0.08);

  cursor:grab;

  transition:
    transform 0.2s,
    box-shadow 0.2s;

  user-select:none;
}

.piece:hover{
  transform:scale(1.05);
}

.piece.dragging{
  cursor:grabbing;
  z-index:1000;
}

/* 슬롯에 들어간 조각 */

.piece.fixed{
  width:100% !important;
  height:100% !important;

  border:none;
  box-shadow:none;

  transform:none !important;

  cursor:default;
}

/* 완성 사진 */

.full-photo{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  opacity:0;

  transition:2s ease;

  z-index:2;
}

.frame.revealed .full-photo{
  opacity:1;
}

/* 빛 효과 */

.flash{
  position:absolute;
  inset:0;

  background:
    radial-gradient(
      circle,
      rgba(255,255,255,1) 0%,
      rgba(255,255,255,0.8) 30%,
      rgba(255,255,255,0.2) 60%,
      transparent 100%
    );

  opacity:0;

  transform:scale(0.8);

  pointer-events:none;

  z-index:5;
}

.frame.active .flash{
  animation:flashAnim 1.5s ease;
  filter:blur(20px);
}

@keyframes flashAnim{

  0%{
    opacity:0;
    transform:scale(0.8);
  }

  30%{
    opacity:1;
    transform:scale(1.1);
  }

  100%{
    opacity:0;
    transform:scale(1.4);
  }

}

.message{
  position:absolute;

  bottom:-70px;

  left:50%;

  transform:translateX(-50%);

  font-size:16px;

  letter-spacing:2px;

  color:#666;
}

</style>
</head>

<body>

<div class="container">

  <!-- 액자 -->

  <div class="frame" id="frame">

    <div class="flash"></div>

    <img
      src="family.png"
      class="full-photo"
    >

    <div class="message">
      Put the memories back together
    </div>

  </div>

  <!-- 퍼즐창 -->

  <div class="pieces-panel" id="piecesPanel"></div>

</div>

<script>

const frame = document.getElementById("frame");
const panel = document.getElementById("piecesPanel");

const cols = 6;
const rows = 4;

const total = cols * rows;

let correct = 0;

/* 슬롯 생성 */

const slots = [];

for(let y=0; y<rows; y++){

  for(let x=0; x<cols; x++){

    const slot = document.createElement("div");

    slot.className = "slot";

    const w = 100 / cols;
    const h = 100 / rows;

    slot.style.width = w + "%";
    slot.style.height = h + "%";

    slot.style.left = x * w + "%";
    slot.style.top = y * h + "%";

    slot.dataset.index = y * cols + x;

    frame.appendChild(slot);

    slots.push(slot);

  }

}

/* 퍼즐 생성 */

for(let y=0; y<rows; y++){

  for(let x=0; x<cols; x++){

    const piece = document.createElement("div");

    piece.className = "piece";

    const index = y * cols + x;

    piece.dataset.index = index;

    /* 이미지 위치 */

    piece.style.backgroundPosition =
      `${(x/(cols-1))*100}% ${(y/(rows-1))*100}%`;

    /* 초기 위치 */

    piece.style.left =
      Math.random() * 220 + "px";

    piece.style.top =
      Math.random() * 700 + "px";

    panel.appendChild(piece);

    /* 드래그 */

    let isDragging = false;

    let offsetX, offsetY;

    piece.addEventListener("mousedown", e=>{

      if(piece.classList.contains("fixed")) return;

      isDragging = true;

      piece.classList.add("dragging");

      offsetX = e.offsetX;
      offsetY = e.offsetY;

    });

    document.addEventListener("mousemove", e=>{

      if(!isDragging) return;

      const panelRect = panel.getBoundingClientRect();

      piece.style.left =
        (e.clientX - panelRect.left - offsetX) + "px";

      piece.style.top =
        (e.clientY - panelRect.top - offsetY) + "px";

    });

    document.addEventListener("mouseup", ()=>{

      if(!isDragging) return;

      isDragging = false;

      piece.classList.remove("dragging");

      /* 슬롯 체크 */

      slots.forEach(slot=>{

        if(slot.dataset.index !== piece.dataset.index)
          return;

        const slotRect = slot.getBoundingClientRect();
        const pieceRect = piece.getBoundingClientRect();

        const centerX =
          pieceRect.left + pieceRect.width / 2;

        const centerY =
          pieceRect.top + pieceRect.height / 2;

        if(
          centerX > slotRect.left &&
          centerX < slotRect.right &&
          centerY > slotRect.top &&
          centerY < slotRect.bottom
        ){

          slot.appendChild(piece);

          piece.classList.add("fixed");

          correct++;

          if(correct === total){

            reveal();

          }

        }

      });

    });

  }

}

/* reveal */

function reveal(){

  frame.classList.add("active");

  setTimeout(()=>{

    frame.classList.add("revealed");

  },500);

}

</script>

</body>
</html>
