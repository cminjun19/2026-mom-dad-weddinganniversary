<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mom & Dad Wedding Anniversary</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      width:100vw;
      height:100vh;
      overflow:hidden;

      background:#f5f5f5;

      font-family:Arial, sans-serif;

      display:flex;
      justify-content:center;
      align-items:center;

      color:#111;
    }

    .container{
      width:100%;
      height:100%;

      display:flex;
      justify-content:space-between;
      align-items:center;

      padding:40px;
      gap:40px;
    }

    /* 액자 영역 */

    .frame-area{
      flex:1;

      display:flex;
      justify-content:center;
      align-items:center;
    }

    .frame{
      width:70vw;
      max-width:1100px;

      aspect-ratio:16/9;

      position:relative;

      border:2px solid rgba(0,0,0,0.08);

      background:white;

      overflow:hidden;

      box-shadow:
        0 10px 40px rgba(0,0,0,0.08),
        inset 0 0 20px rgba(0,0,0,0.03);
    }

    /* 퍼즐 슬롯 */

    .slot{
      position:absolute;

      border:1px solid rgba(0,0,0,0.04);

      transition:0.2s;
    }

    .slot.hovered{
      background:rgba(0,0,0,0.03);
    }

    /* 가족사진 */

    .photo{
      position:absolute;
      inset:0;

      width:100%;
      height:100%;

      object-fit:cover;

      opacity:0;

      transition:2s ease;
    }

    .frame.revealed .photo{
      opacity:1;
    }

    /* 빛 효과 */

    .light{
      position:absolute;
      inset:0;

      background:white;

      opacity:0;

      pointer-events:none;
    }

    .frame.flash .light{
      animation:flash 1.5s ease;
    }

    @keyframes flash{

      0%{
        opacity:0;
      }

      40%{
        opacity:1;
      }

      100%{
        opacity:0;
      }

    }

    /* 문구 */

    .message{
      position:absolute;

      bottom:-70px;

      left:50%;

      transform:translateX(-50%);

      font-size:16px;

      letter-spacing:2px;

      color:#666;
    }

    /* 오른쪽 퍼즐 창 */

    .pieces-panel{
      width:320px;
      height:90vh;

      background:rgba(255,255,255,0.7);

      border:1px solid rgba(0,0,0,0.08);

      border-radius:28px;

      backdrop-filter:blur(20px);

      padding:20px;

      display:flex;
      flex-wrap:wrap;
      align-content:flex-start;

      gap:10px;

      overflow-y:auto;

      box-shadow:
        0 10px 30px rgba(0,0,0,0.05);
    }

    /* 퍼즐 조각 */

    .piece{
      width:60px;
      height:60px;

      background:#fafafa;

      border:1px solid rgba(0,0,0,0.08);

      cursor:grab;

      transition:0.2s;

      user-select:none;

      box-shadow:
        0 4px 10px rgba(0,0,0,0.05);
    }

    .piece:hover{
      transform:scale(1.05);

      box-shadow:
        0 10px 20px rgba(0,0,0,0.08);
    }

    .piece.dragging{
      opacity:0.5;
    }

    /* 모바일 */

    @media(max-width:900px){

      body{
        overflow:auto;
      }

      .container{
        flex-direction:column;
        padding:20px;
      }

      .frame{
        width:95vw;
      }

      .pieces-panel{
        width:100%;
        height:250px;
      }

    }

  </style>

</head>

<body>

  <div class="container">

    <!-- 액자 -->

    <div class="frame-area">

      <div class="frame" id="frame">

        <!-- 가족사진 -->

        <img
          class="photo"
          src="family.png"
          alt=""
        >

        <!-- 빛 -->

        <div class="light"></div>

        <!-- 문구 -->

        <div class="message">
          Put the memories back together
        </div>

      </div>

    </div>

    <!-- 퍼즐 창 -->

    <div class="pieces-panel" id="piecesPanel"></div>

  </div>

  <script>

    const frame = document.getElementById("frame");
    const piecesPanel = document.getElementById("piecesPanel");

    const cols = 6;
    const rows = 4;

    const total = cols * rows;

    let correctCount = 0;

    /* 슬롯 생성 */

    for(let y = 0; y < rows; y++){

      for(let x = 0; x < cols; x++){

        const slot = document.createElement("div");

        slot.classList.add("slot");

        const w = 100 / cols;
        const h = 100 / rows;

        slot.style.width = w + "%";
        slot.style.height = h + "%";

        slot.style.left = x * w + "%";
        slot.style.top = y * h + "%";

        slot.dataset.index = y * cols + x;

        slot.addEventListener("dragover", e => {

          e.preventDefault();

          slot.classList.add("hovered");

        });

        slot.addEventListener("dragleave", () => {

          slot.classList.remove("hovered");

        });

        slot.addEventListener("drop", e => {

          e.preventDefault();

          slot.classList.remove("hovered");

          const pieceId = e.dataTransfer.getData("text");

          const piece = document.getElementById(pieceId);

          if(piece.dataset.index === slot.dataset.index){

            if(!slot.hasChildNodes()){

              slot.appendChild(piece);

              piece.style.width = "100%";
              piece.style.height = "100%";

              piece.style.transform = "rotate(0deg)";

              piece.style.cursor = "default";

              piece.draggable = false;

              correctCount++;

              // 마지막 퍼즐 완성

              if(correctCount === total){

                revealPhoto();

              }

            }

          }

        });

        frame.appendChild(slot);

      }

    }

    /* 퍼즐 생성 */

    for(let i = 0; i < total; i++){

      const piece = document.createElement("div");

      piece.classList.add("piece");

      piece.id = "piece-" + i;

      piece.draggable = true;

      piece.dataset.index = i;

      // 랜덤 회전

      const rotate = Math.random() * 20 - 10;

      piece.style.transform = `rotate(${rotate}deg)`;

      piece.addEventListener("dragstart", e => {

        piece.classList.add("dragging");

        e.dataTransfer.setData("text", piece.id);

      });

      piece.addEventListener("dragend", () => {

        piece.classList.remove("dragging");

      });

      piecesPanel.appendChild(piece);

    }

    /* reveal */

    function revealPhoto(){

      frame.classList.add("flash");

      setTimeout(() => {

        frame.classList.add("revealed");

      }, 700);

    }

  </script>

</body>
</html>
