<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Puzzle Test</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  width:100vw;
  height:100vh;

  background:#f5f5f5;

  display:flex;
  justify-content:center;
  align-items:center;

  font-family:sans-serif;
}

/* 전체 */

.container{
  display:flex;
  gap:40px;
  align-items:center;
}

/* 액자 */

.board{
  width:960px;
  height:540px;

  background:white;

  position:relative;

  border:2px solid #ddd;

  display:grid;
  grid-template-columns:repeat(6,1fr);
  grid-template-rows:repeat(4,1fr);

  box-shadow:
    0 10px 30px rgba(0,0,0,0.08);
}

/* 슬롯 */

.slot{
  border:1px solid #e5e5e5;

  position:relative;
}

/* 퍼즐 창 */

.panel{
  width:300px;
  height:700px;

  background:white;

  border-radius:30px;

  position:relative;

  overflow:hidden;

  border:1px solid #ddd;

  box-shadow:
    0 10px 30px rgba(0,0,0,0.08);
}

/* 퍼즐 조각 */

.piece{
  width:120px;
  height:135px;

  position:absolute;

  cursor:grab;

  border:1px solid rgba(0,0,0,0.08);

  background-image:url("family.png");

  background-size:600% 400%;

  background-repeat:no-repeat;

  box-shadow:
    0 5px 10px rgba(0,0,0,0.08);

  transition:
    transform 0.2s,
    box-shadow 0.2s;

  user-select:none;
}

.piece:hover{
  transform:scale(1.03);
}

.piece.dragging{
  opacity:0.7;
  cursor:grabbing;
  z-index:9999;
}

/* 고정된 퍼즐 */

.piece.fixed{
  width:100%;
  height:100%;

  left:0 !important;
  top:0 !important;

  border:none;
  box-shadow:none;

  cursor:default;

  transform:none !important;
}

/* 완성 사진 */

.final-photo{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  opacity:0;

  transition:2s;

  pointer-events:none;
}

.board.complete .final-photo{
  opacity:1;
}

/* 빛 효과 */

.flash{
  position:absolute;
  inset:0;

  background:
    radial-gradient(
      circle,
      rgba(255,255,255,1) 0%,
      rgba(255,255,255,0.7) 40%,
      transparent 100%
    );

  opacity:0;

  pointer-events:none;
}

.board.flash-active .flash{
  animation:flash 1.5s ease;
}

@keyframes flash{

  0%{
    opacity:0;
    transform:scale(0.8);
  }

  40%{
    opacity:1;
    transform:scale(1.1);
  }

  100%{
    opacity:0;
    transform:scale(1.5);
  }

}

</style>
</head>

<body>

<div class="container">

  <!-- 퍼즐판 -->

  <div class="board" id="board">

    <div class="flash"></div>

    <img
      src="family.png"
      class="final-photo"
    >

  </div>

  <!-- 오른쪽 퍼즐창 -->

  <div class="panel" id="panel"></div>

</div>

<script>

const board = document.getElementById("board");
const panel = document.getElementById("panel");

const cols = 6;
const rows = 4;

const total = cols * rows;

let correct = 0;

const slots = [];

/* 슬롯 생성 */

for(let i=0; i<total; i++){

  const slot = document.createElement("div");

  slot.className = "slot";

  slot.dataset.index = i;

  board.appendChild(slot);

  slots.push(slot);

}

/* 퍼즐 생성 */

for(let y=0; y<rows; y++){

  for(let x=0; x<cols; x++){

    const index = y * cols + x;

    const piece = document.createElement("div");

    piece.className = "piece";

    piece.dataset.index = index;

    /* 퍼즐 이미지 위치 */

    piece.style.backgroundPosition =
      `${x * 20}% ${y * 33.33}%`;

    /* 랜덤 위치 */

    piece.style.left =
      Math.random() * 150 + 20 + "px";

    piece.style.top =
      Math.random() * 520 + 20 + "px";

    panel.appendChild(piece);

    /* 드래그 */

    let dragging = false;

    let offsetX = 0;
    let offsetY = 0;

    piece.addEventListener("mousedown", e=>{

      if(piece.classList.contains("fixed"))
        return;

      dragging = true;

      piece.classList.add("dragging");

      offsetX = e.clientX - piece.offsetLeft;
      offsetY = e.clientY - piece.offsetTop;

    });

    document.addEventListener("mousemove", e=>{

      if(!dragging) return;

      const panelRect =
        panel.getBoundingClientRect();

      piece.style.left =
        e.clientX - panelRect.left - offsetX + "px";

      piece.style.top =
        e.clientY - panelRect.top - offsetY + "px";

    });

    document.addEventListener("mouseup", ()=>{

      if(!dragging) return;

      dragging = false;

      piece.classList.remove("dragging");

      /* 슬롯 체크 */

      slots.forEach(slot=>{

        if(slot.dataset.index != piece.dataset.index)
          return;

        if(slot.querySelector(".piece"))
          return;

        const slotRect =
          slot.getBoundingClientRect();

        const pieceRect =
          piece.getBoundingClientRect();

        const centerX =
          pieceRect.left + pieceRect.width / 2;

        const centerY =
          pieceRect.top + pieceRect.height / 2;

        /* 슬롯 안에 들어갔는지 */

        if(
          centerX > slotRect.left &&
          centerX < slotRect.right &&
          centerY > slotRect.top &&
          centerY < slotRect.bottom
        ){

          slot.appendChild(piece);

          piece.classList.add("fixed");

          correct++;

          /* 퍼즐 완성 */

          if(correct === total){

            reveal();

          }

        }

      });

    });

  }

}

/* 완성 연출 */

function reveal(){

  board.classList.add("flash-active");

  setTimeout(()=>{

    board.classList.add("complete");

  },500);

}

</script>

</body>
</html>
