<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mom & Dad Wedding Anniversary</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      width:100vw;
      height:100vh;
      overflow:hidden;
      background:#050505;
      font-family:Arial, sans-serif;
      display:flex;
      justify-content:center;
      align-items:center;
      color:white;
    }

    .container{
      width:100%;
      height:100%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:40px;
      gap:40px;
    }

    /* 액자 영역 */

    .frame-area{
      flex:1;
      display:flex;
      justify-content:center;
      align-items:center;
      position:relative;
    }

    .frame{
      width:70vw;
      max-width:1100px;
      aspect-ratio:16/9;
      position:relative;
      border:3px solid rgba(255,255,255,0.12);
      background:#0a0a0a;
      box-shadow:
        0 0 30px rgba(255,255,255,0.03),
        inset 0 0 30px rgba(255,255,255,0.03);
    }

    .slot{
      position:absolute;
      border:1px solid rgba(255,255,255,0.05);
    }

    /* 퍼즐 패널 */

    .pieces-panel{
      width:320px;
      height:90vh;
      border:1px solid rgba(255,255,255,0.08);
      background:rgba(255,255,255,0.03);
      backdrop-filter:blur(20px);
      border-radius:24px;
      padding:20px;
      display:flex;
      flex-wrap:wrap;
      align-content:flex-start;
      gap:10px;
      overflow-y:auto;
    }

    /* 퍼즐 조각 */

    .piece{
      width:60px;
      height:60px;
      background:#111;
      border:1px solid rgba(255,255,255,0.08);
      cursor:grab;
      transition:0.2s;
      display:flex;
      justify-content:center;
      align-items:center;
      color:#444;
      user-select:none;
    }

    .piece:hover{
      transform:scale(1.05);
      box-shadow:0 0 15px rgba(255,255,255,0.1);
    }

    .piece.dragging{
      opacity:0.5;
    }

    /* reveal */

    .photo{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      opacity:0;
      transition:2s;
    }

    .frame.revealed .photo{
      opacity:1;
    }

    .light{
      position:absolute;
      inset:0;
      background:white;
      opacity:0;
      pointer-events:none;
    }

    .frame.flash .light{
      animation:flash 1.5s ease;
    }

    @keyframes flash{
      0%{
        opacity:0;
      }
      40%{
        opacity:1;
      }
      100%{
        opacity:0;
      }
    }

    .message{
      position:absolute;
      bottom:-70px;
      left:50%;
      transform:translateX(-50%);
      font-size:18px;
      letter-spacing:2px;
      opacity:0.6;
    }

  </style>
</head>

<body>

  <div class="container">

    <!-- 액자 -->

    <div class="frame-area">

      <div class="frame" id="frame">

        <img
          class="photo"
          src="family.jpg"
          alt=""
        >

        <div class="light"></div>

        <div class="message">
          Put the memories back together
        </div>

      </div>

    </div>

    <!-- 퍼즐 창 -->

    <div class="pieces-panel" id="piecesPanel"></div>

  </div>

  <script>

    const frame = document.getElementById("frame");
    const piecesPanel = document.getElementById("piecesPanel");

    const cols = 6;
    const rows = 4;
    const total = cols * rows;

    let correctCount = 0;

    // 슬롯 생성

    for(let y=0; y<rows; y++){

      for(let x=0; x<cols; x++){

        const slot = document.createElement("div");

        slot.classList.add("slot");

        const w = 100 / cols;
        const h = 100 / rows;

        slot.style.width = w + "%";
        slot.style.height = h + "%";

        slot.style.left = x * w + "%";
        slot.style.top = y * h + "%";

        slot.dataset.index = y * cols + x;

        slot.addEventListener("dragover", e=>{
          e.preventDefault();
        });

        slot.addEventListener("drop", e=>{

          e.preventDefault();

          const pieceId = e.dataTransfer.getData("text");
          const piece = document.getElementById(pieceId);

          if(piece.dataset.index === slot.dataset.index){

            if(!slot.hasChildNodes()){

              slot.appendChild(piece);

              piece.style.width = "100%";
              piece.style.height = "100%";

              piece.style.cursor = "default";

              piece.draggable = false;

              correctCount++;

              // 마지막 퍼즐 완성

              if(correctCount === total){

                revealPhoto();

              }

            }

          }

        });

        frame.appendChild(slot);

      }

    }

    // 퍼즐 생성

    for(let i=0; i<total; i++){

      const piece = document.createElement("div");

      piece.classList.add("piece");

      piece.id = "piece-" + i;

      piece.draggable = true;

      piece.dataset.index = i;

      piece.innerText = "";

      piece.addEventListener("dragstart", e=>{

        piece.classList.add("dragging");

        e.dataTransfer.setData("text", piece.id);

      });

      piece.addEventListener("dragend", ()=>{

        piece.classList.remove("dragging");

      });

      piecesPanel.appendChild(piece);

    }

    // reveal

    function revealPhoto(){

      frame.classList.add("flash");

      setTimeout(()=>{

        frame.classList.add("revealed");

      },700);

    }

  </script>

</body>
</html>
